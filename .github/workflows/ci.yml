name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Licence audit
        run: npm run audit:licenses

      - name: Bundle budgets
        run: npm run check:budgets

      - name: Fail if notices drifted
        run: git diff --exit-code -- THIRD-PARTY-NOTICES.md
